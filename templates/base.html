<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SocialPoster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;600;700&family=Almarai:wght@400;700;800&display=swap">
<style>
  /* ===== Neon / Cyberpunk ===== */
  :root{
    --bg:#0B0420; --ink:#F3EDFF; --muted:#B9AEDB; --line:rgba(201,190,234,.22);
    --glass:rgba(26,12,58,.72); --glass-line:rgba(255,79,216,.35); --field:rgba(11,4,32,.7);
    --magenta:#FF2BD6; --magenta-2:#FF4FD8; --magenta-soft:rgba(255,43,214,.16); --pink-ink:#FFB3F0;
    --cyan:#00E5FF; --cyan-soft:rgba(0,229,255,.16); --cyan-ink:#9BF4FF; --violet:#8B5CF6;
    --accent:var(--magenta-2); --accent-soft:var(--magenta-soft);
    --ok:#4ADE80; --ok-soft:rgba(74,222,128,.14); --err:#FF6B8B; --err-soft:rgba(255,107,139,.14);
    --warn:#FBBF24; --warn-soft:rgba(251,191,36,.12);
  }
  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{margin:0;min-height:100vh;color:var(--ink);font-family:"Exo 2","Almarai",system-ui,sans-serif;
    background:
      radial-gradient(900px 420px at 90% -10%,rgba(255,43,214,.26),transparent 60%),
      radial-gradient(800px 460px at -5% 105%,rgba(0,229,255,.18),transparent 60%),
      var(--bg)}
  nav{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;padding:12px 22px;
    background:rgba(11,4,32,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--glass-line)}
  nav .logo{font-family:"Audiowide",sans-serif;font-size:22px;color:var(--magenta-2);direction:ltr;
    text-shadow:0 0 12px rgba(255,79,216,.75);margin-left:auto}
  nav .logo b{font-weight:400;color:var(--cyan);text-shadow:0 0 12px rgba(0,229,255,.75)}
  nav .tabs{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line)}
  nav .tabs a{color:#C9BEEA;text-decoration:none;padding:8px 20px;border-radius:999px;font-weight:600}
  nav .tabs a:hover{color:#fff}
  nav .tabs a.on{background:linear-gradient(90deg,var(--magenta),var(--violet));color:#fff;box-shadow:0 0 16px rgba(255,43,214,.45)}
  .wrap{max-width:1040px;margin:0 auto;padding:26px 18px 70px}
  h1{font-family:"Almarai",sans-serif;font-size:36px;font-weight:800;margin:0 0 6px}
  h1 span{color:var(--cyan);text-shadow:0 0 14px rgba(0,229,255,.7)}
  .sub{color:var(--muted);margin:0 0 20px}
  .card{background:var(--glass);border:1px solid var(--glass-line);border-radius:18px;padding:22px;margin-bottom:18px;
    box-shadow:0 0 0 1px rgba(0,229,255,.06) inset,0 10px 40px rgba(0,0,0,.25)}
  h2{font-size:18px;margin:0 0 14px;color:var(--pink-ink)}
  label.t{display:block;font-weight:700;margin:16px 0 7px;color:var(--pink-ink)}
  textarea,input[type=text],input[type=password],input[type=datetime-local]{width:100%;padding:11px 12px;font:inherit;
    color:var(--ink);background:var(--field);border:1px solid rgba(0,229,255,.28);border-radius:11px;outline:none}
  textarea:focus,input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,229,255,.18)}
  ::placeholder{color:#8C80B4}
  input[type=datetime-local]{color-scheme:dark}
  input[type=checkbox],input[type=radio]{accent-color:var(--magenta)}
  input[type=text],input[type=password]{direction:ltr;text-align:left}
  textarea{min-height:110px;resize:vertical}
  a{color:var(--cyan-ink)} a:hover{color:#fff}
  button,.btn{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:12px;padding:12px 22px;color:#fff;
    background:linear-gradient(90deg,var(--magenta),var(--violet) 55%,#00B8D9);box-shadow:0 0 22px rgba(255,43,214,.35);
    text-decoration:none;display:inline-block;transition:filter .15s,box-shadow .15s}
  button:hover,.btn:hover{filter:brightness(1.1);box-shadow:0 0 30px rgba(255,43,214,.55)}
  button:disabled{opacity:.45;cursor:not-allowed;filter:none}
  button.soft,.btn.soft{background:var(--cyan-soft);color:#E6FCFF;border:1px solid var(--cyan);box-shadow:0 0 14px rgba(0,229,255,.18)}
  button.ghost{background:transparent;box-shadow:none;color:var(--err);padding:4px 8px;font-size:13px}
  .flash{padding:11px 14px;border-radius:12px;margin-bottom:10px;border:1px solid}
  .flash.ok{background:var(--ok-soft);color:#BBF7D0;border-color:rgba(74,222,128,.4)}
  .flash.error{background:var(--err-soft);color:#FFC2CF;border-color:rgba(255,107,139,.45)}
  .banner{background:var(--warn-soft);color:#FDE68A;border:1px solid rgba(251,191,36,.35);padding:11px 14px;border-radius:12px;margin-bottom:14px}
  .banner a{color:inherit;font-weight:700}
  .hint{font-size:12px;color:var(--muted)}
  .tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;margin:2px;border:1px solid var(--line);color:var(--muted)}
  .tag.ok{background:var(--ok-soft);color:#BBF7D0;border-color:rgba(74,222,128,.45)}
  .tag.error{background:var(--err-soft);color:#FFC2CF;border-color:rgba(255,107,139,.5)}
  .tag.pending,.tag.cancelled{background:rgba(201,190,234,.08)}
  @media (max-width:640px){nav{flex-wrap:wrap} nav .logo{margin-left:0} h1{font-size:28px}}
</style>
{% block head %}{% endblock %}
</head>
<body>
<nav>
  <span class="logo">SOCIAL<b>POSTER</b></span>
  <div class="tabs">
    <a href="/" class="{{ 'on' if page=='post' }}">نشر</a>
    <a href="/settings" class="{{ 'on' if page=='settings' }}">الإعدادات</a>
  </div>
</nav>
<div class="wrap">
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}<div class="flash {{cat}}">{{m}}</div>{% endfor %}
  {% endwith %}
  {% block body %}{% endblock %}
</div>
</body>
</html>
